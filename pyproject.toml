[project]
name = "bilibili-extractor"
version = "0.1.0"
description = "Extract video/audio streams from Bilibili by BV id"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "tqdm>=4.66",
    "qrcode>=7.4",
]

[project.scripts]
bilibili-extractor = "bilibili_extractor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bilibili_extractor"]
